<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1A17"/>
      <stop offset="100%" stop-color="#272520"/>
    </linearGradient>
    <linearGradient id="reggaeRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8112D"/>
      <stop offset="50%" stop-color="#FFC72C"/>
      <stop offset="100%" stop-color="#1EB53A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#reggaeRing)" stroke-width="12" filter="url(#glow)" opacity="0.85"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#reggaeRing)" stroke-width="6"/>

  <!-- Gamepad Silhouette Body -->
  <path d="M 140 190 C 200 170, 312 170, 372 190 C 430 210, 460 310, 410 400 C 380 440, 340 420, 310 360 C 280 300, 232 300, 202 360 C 172 420, 132 440, 102 400 C 52 310, 82 210, 140 190 Z" 
        fill="#151412" stroke="#4A4536" stroke-width="8"/>

  <!-- Reggae Colored Buttons & Controls -->
  <!-- D-Pad Left -->
  <path d="M 150 250 L 170 250 L 170 230 L 190 230 L 190 250 L 210 250 L 210 270 L 190 270 L 190 290 L 170 290 L 170 270 L 150 270 Z" fill="#1EB53A"/>

  <!-- ABXY Buttons Right -->
  <!-- Y (Gold) -->
  <circle cx="340" cy="225" r="16" fill="#FFC72C"/>
  <!-- B (Red) -->
  <circle cx="375" cy="260" r="16" fill="#E8112D"/>
  <!-- A (Green) -->
  <circle cx="340" cy="295" r="16" fill="#1EB53A"/>
  <!-- X (Teal) -->
  <circle cx="305" cy="260" r="16" fill="#4FBFA8"/>

  <!-- Analog Sticks -->
  <circle cx="210" cy="315" r="28" fill="#2B2822" stroke="#FFC72C" stroke-width="4"/>
  <circle cx="302" cy="315" r="28" fill="#2B2822" stroke="#FFC72C" stroke-width="4"/>

  <!-- Central Emblem / Leaf -->
  <g transform="translate(256, 215) scale(0.9)">
    <circle cx="0" cy="0" r="28" fill="#272520" stroke="#FFC72C" stroke-width="3"/>
    <text x="0" y="10" font-size="28" text-anchor="middle" fill="#1EB53A">🌿</text>
  </g>

  <!-- Wi-Fi / Streaming Signal Waves (Top) -->
  <path d="M 196 130 A 80 80 0 0 1 316 130" fill="none" stroke="#1EB53A" stroke-width="8" stroke-linecap="round"/>
  <path d="M 166 100 A 120 120 0 0 1 346 100" fill="none" stroke="#FFC72C" stroke-width="8" stroke-linecap="round"/>
  <path d="M 136 70 A 160 160 0 0 1 376 70" fill="none" stroke="#E8112D" stroke-width="8" stroke-linecap="round"/>
</svg>
