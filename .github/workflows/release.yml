name: 🚀 Build & Publish Parsage Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Web Client & Server
        run: |
          cd web && npm install && npm run build
          cd ../server && npm install && npm test

      - name: Build Debian (.deb) & Tarball
        run: |
          python3 packaging/build_deb.py
          python3 packaging/test_packaging.py
          tar -czf dist_pkg/parsage-standalone-linux-x64.tar.gz bin host server web packaging package.json README.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_pkg/parsage_*_all.deb
            dist_pkg/parsage-standalone-linux-x64.tar.gz
            packaging/install.sh
          tag_name: ${{ github.ref_name || 'v0.2.0' }}
          name: 🌿 Parsage Release ${{ github.ref_name || 'v0.2.0' }}
          draft: false
          prerelease: false
          body: |
            ## 🌿 Parsage: Low Latency Linux Game & Desktop Streaming
            *Created with ❤️ by Sage & Antigravity*

            ### 📦 Downloads:
            - **Linux Mint / Ubuntu / Debian (.deb)**: Download `parsage_*_all.deb` and double-click to install.
            - **Universal Linux Tarball**: Download `parsage-standalone-linux-x64.tar.gz`.
            - **1-Click Shell Installer**: Run `./install.sh`.
